services:

  db:
    image: postgres:17
    container_name: meddera_crm_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./volumes/db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - crm-net

  app:
    container_name: meddera_crm_frontend 
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_TELEGRAM_CLIENT_ID=${NEXT_PUBLIC_TELEGRAM_CLIENT_ID}
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      HOSTNAME: "0.0.0.0"   # <--- Добавить это
      PORT: "3000"          # <--- Добавить это (опционально, но рекомендуется)
    depends_on:
      db:
        condition: service_healthy
    networks:
      - crm-net
      - custom_meddera_network 

networks:
  crm-net:
    driver: bridge
  custom_meddera_network:
    external: true 
